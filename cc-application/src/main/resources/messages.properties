INPUT_INVALID=Some input is invalid. Check the fields and date range, then try again.
AUTHENTICATION_REQUIRED=Sign in with an active account to continue.
ACTION_FORBIDDEN=You do not have permission to perform this action.
SELF_APPROVAL_FORBIDDEN=You cannot approve your own request. Another authorised user must review it.
RESOURCE_NOT_AVAILABLE=The requested resource is not available.
ENDPOINT_NOT_FOUND=The requested API endpoint does not exist.
REQUEST_METHOD_NOT_ALLOWED=This HTTP method is not supported for the requested endpoint.
DUPLICATE_KEY=A record or pending request with this identifier already exists.
REQUEST_ALREADY_PENDING=This record already has a change awaiting approval. Review the pending request first.
STALE_VERSION=This record has changed. Refresh it and submit a new request.
INVALID_TRANSITION=This action is not available in the current state. Refresh the record.
BUSINESS_RULE_VIOLATION=The proposed values do not satisfy the business rules, or no values changed.
REPORT_NOT_READY=Your report is still being generated. Check its status before downloading.
REPORT_EXPIRED=This report has expired. Generate a new report to download it.
REPORT_TOO_LARGE=This report exceeds the configured size limit. Narrow the selection criteria.
MEDIA_TYPE_NOT_SUPPORTED=The request content type is not supported.
PERSISTENCE_UNAVAILABLE=The service is temporarily unavailable. Try again later using the same operation reference.
INTERNAL_ERROR=We could not complete the request. Contact support with the trace reference.
AUDIT_EVIDENCE_INVALID=We could not safely record the activity. The operation was not completed. Contact support with the trace reference.

# Customisable module-owned error messages. Public codes and message keys are independent.
error.system.input-invalid=Some input is invalid. Check the fields and try again.
error.system.endpoint-not-found=The requested API endpoint does not exist.
error.system.method-not-allowed=This HTTP method is not supported for the requested endpoint.
error.system.duplicate-key=A record with this identifier already exists.
error.system.optimistic-lock-conflict=The data changed while this request was processed. Refresh and try again.
error.system.media-type-not-supported=The request content type is not supported.
error.system.internal=We could not complete the request. Contact support with the trace reference.
error.system.persistence-unavailable=The service is temporarily unavailable. Try again later using the same operation reference.

