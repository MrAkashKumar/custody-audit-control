# Local development only. H2 is not a production database.
spring.datasource.url=${CC_DB_URL:jdbc:h2:file:./.runtime/custody}
spring.datasource.username=cc_app
spring.datasource.password=${CC_DB_APP_PASSWORD:local-app-change-me}
spring.flyway.url=${spring.datasource.url};DB_CLOSE_DELAY=-1
spring.flyway.user=sa
spring.flyway.password=${CC_DB_ADMIN_PASSWORD:}
spring.flyway.placeholders.appPassword=${CC_DB_APP_PASSWORD:local-app-change-me}
spring.flyway.placeholders.retentionPassword=${CC_DB_RETENTION_PASSWORD:local-retention-change-me}
cc.retention.username=cc_retention
cc.retention.password=${CC_DB_RETENTION_PASSWORD:local-retention-change-me}
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.locations=classpath:db/migration/h2
spring.h2.console.enabled=false
