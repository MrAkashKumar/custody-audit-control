spring.application.name=custody-audit-control
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.context-path=${CC_CONTEXT_PATH:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=20m
server.error.include-message=never
server.error.include-stacktrace=never
logging.structured.format.console=ecs
logging.level.org.hibernate=WARN
management.endpoints.web.exposure.include=health
cc.reports.expiry-days=7
cc.reports.max-rows=10000
cc.jobs.poll-ms=5000
cc.retention.years=7
cc.retention.minimum-years=7
cc.retention.enabled=false
cc.retention.dry-run=true
cc.retention.batch-size=1000
cc.retention.cron=0 0 3 * * *
cc.audit.suspicious.failed-login-threshold=5
cc.audit.suspicious.window-seconds=600
cc.audit.suspicious.maximum-tracked-subjects=10000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Select exactly one environment; demo is a development-only addition.
spring.profiles.default=dev
spring.profiles.group.demo=dev

# Render the custom banner as one structured log event.
spring.main.banner-mode=log
