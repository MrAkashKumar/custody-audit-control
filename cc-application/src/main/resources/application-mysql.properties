# Shared SIT/UAT/prod database settings; no local credential fallbacks.
spring.datasource.url=${CC_DB_URL}
spring.datasource.username=${CC_DB_APP_USERNAME}
spring.datasource.password=${CC_DB_APP_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${CC_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${CC_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
# MySQL migration delivery is pending. Deployment must provision the schema separately.
# Hibernate still validates the schema; it will not create missing tables.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
cc.retention.username=${CC_DB_RETENTION_USERNAME}
cc.retention.password=${CC_DB_RETENTION_PASSWORD}
server.address=${CC_BIND_ADDRESS:0.0.0.0}
server.servlet.session.cookie.secure=true
